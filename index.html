<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌲 1000 Hours</title>
  <link rel="apple-touch-icon" href="logo2.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="1000 Hours" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap');

    :root {
      --salmon: #F79F77;
      --light-blue: #80BEF5;
      --pale-yellow: #F6D58A;
      --black: #010101;
      --white: #FFFFFF;
      --light-gray: #F5F5F5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Raleway', sans-serif;
      color: var(--black);
      line-height: 1.6;
      padding: 20px;
      background-color: var(--white);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .goal-card.full-width-goal {
      width: 90%;
      max-width: 90%;
    }

    h1 {
      font-size: 40px;
      color: var(--black);
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    .corner-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }

    .corner-button {
      padding: 5px 10px;
      font-size: 12px;
      background-color: transparent;
      color: var(--black);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .corner-button:hover {
      background-color: rgba(128, 190, 245, 0.2);
    }

    .goal-form,
    .task-form {
      display: none;
      background: var(--light-gray);
      padding: 10px;
      border-radius: 10px;
      position: absolute;
      top: 40px;
      right: 10px;
      z-index: 999;
      width: 250px;
    }

    .goal-form input,
    .task-form input {
      width: calc(100% - 2rem);
      padding: 12px 15px;
      border: 2px solid var(--light-blue);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .goal-form button,
    .task-form button {
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .goal-form button:hover,
    .task-form button:hover {
      background: var(--salmon);
    }

    .search-bar {
      width: calc(100% - 2rem);
      padding: 12px 15px;
      border: 2px solid var(--light-blue);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    button,
    .small-button {
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover,
    .small-button:hover {
      background: var(--salmon);
      transform: translateY(-2px);
    }

    button:active,
    .small-button:active {
      transform: translateY(1px);
    }

    #csvInput {
      display: none;
    }

    .task {
      background: var(--light-gray);
      border: none;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .task-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--black);
    }

    .progress-bar {
      position: relative;
      height: 16px;
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress {
      height: 100%;
      background: linear-gradient(45deg, var(--salmon), var(--light-blue), var(--pale-yellow));
    }

    .progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: var(--black);
      font-weight: 600;
    }

    .increment-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .increment-buttons button {
      padding: 8px 12px;
      font-size: 12px;
      flex: 1;
      min-width: 70px;
    }

    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .tag-pill {
      display: inline-block;
      background: var(--light-blue);
      color: var(--white);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .tag-pill.selected {
      background: var(--salmon);
    }

    #congratsMessage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #4CAF50;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 1000;
      display: none;
    }

    .goals-list {
      margin-bottom: 8px;
    }

    .goals-list h2 {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .goals-scroll {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 10px;
    }

    .goal-card {
      background: var(--light-gray);
      border-radius: 10px;
      padding: 15px;
      min-width: 200px;
      flex: 0 0 auto;
      position: relative;
    }

    .goal-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--black);
    }

    .level-indicator {
      font-size: 12px;
      font-weight: 400;
      color: #888;
      margin-left: 5px;
    }

    .goal-progress-bar {
      position: relative;
      height: 16px;
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .goal-progress {
      height: 100%;
      background: linear-gradient(45deg, var(--salmon), var(--light-blue), var(--pale-yellow));
      transition: width 0.3s ease;
    }

    .goal-progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: var(--black);
      font-weight: 600;
    }

    .edit-delete-btns {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }

    .edit-delete-btns button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: var(--black);
      padding: 3px 5px;
      border-radius: 5px;
    }

    .edit-delete-btns button:hover {
      background: var(--light-blue);
      color: var(--white);
    }

    .celebration-badge {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: var(--black);
      padding: 3px 5px;
      border-radius: 5px;
    }

    .celebration-badge:hover {
      background: var(--light-blue);
      color: var(--white);
    }

    .level-up-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .level-up-content {
      background: var(--white);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .level-up-content h3 {
      margin-bottom: 20px;
      color: var(--black);
    }

    .level-up-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .level-up-buttons button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .keep-btn {
      background: var(--light-blue);
      color: var(--white);
    }

    .keep-btn:hover {
      background: var(--salmon);
    }

    .level-up-btn {
      background: var(--black);
      color: var(--white);
    }

    .level-up-btn:hover {
      background: var(--salmon);
    }

    .weekly-dashboard {
      margin-top: 10px;
      padding: 5px 0;
    }

    .weekly-chart {
      display: flex;
      justify-content: space-between;
      align-items: end;
      height: 25px;
      gap: 2px;
    }

    .day-bar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .bar {
      width: 100%;
      min-height: 2px;
      background: #d0d0d0;
      border-radius: 2px 2px 0 0;
      transition: all 0.3s ease;
      position: relative;
    }

    .day-label {
      font-size: 8px;
      color: var(--black);
      margin-top: 2px;
      font-weight: 500;
    }

    .time-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--black);
      color: var(--white);
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      margin-bottom: 2px;
    }

    .day-bar:hover .time-tooltip {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="congratsMessage"></div>

  <!-- Level Up Modal -->
  <div class="level-up-modal" id="levelUpModal">
    <div class="level-up-content">
      <h3 id="levelUpTitle">🎉 Congratulations!</h3>
      <p id="levelUpMessage">You've reached 1000 hours!</p>
      <div class="level-up-buttons">
        <button class="keep-btn" onclick="keepCelebration()">Keep</button>
        <button class="level-up-btn" onclick="levelUpGoal()">Level Up</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="corner-buttons">
      <button class="corner-button" onclick="toggleGoalForm()">+ Goal</button>
      <button class="corner-button" onclick="toggleTaskForm()">+ Task</button>
    </div>

    <div class="goal-form" id="goalForm">
      <input type="text" id="newGoalInput" placeholder="Enter new goal name" />
      <button onclick="createGoal()">Add</button>
    </div>

    <div class="task-form" id="taskForm">
      <input type="text" id="newTaskName" placeholder="Enter new task name" />
      <input type="number" id="newTaskGoal" placeholder="Task goal (number)" />
      <p>Select Goals (Tags):</p>
      <div id="newTaskGoalsContainer"></div>
      <button onclick="addTask()">Add</button>
    </div>

    <h1 id="bigGoalTitle"></h1>

    <div class="goals-list" style="display:none;">
      <h2>Goals</h2>
      <div class="goals-scroll" id="goalsContainer"></div>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Search tasks..." />
    <div id="taskList"></div>

    <div class="button-group">
      <label for="csvInput" id="csvLabel" class="small-button">Import</label>
      <input type="file" id="csvInput" accept=".xlsx" />
      <button onclick="exportXLSX()" class="small-button">Export</button>
      <button onclick="clearStorage()" class="small-button">Clear</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    let BIG_GOAL_NAME = "1000 Hours";
    let GOAL_TOTAL_HOURS = 1000;
    let GOAL_WEEKLY_HOURS = 21;
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let weeklyProgress = JSON.parse(localStorage.getItem('weeklyProgress')) || { startDate: null };
    let goals = JSON.parse(localStorage.getItem('goals')) || {};
    let goalLevels = JSON.parse(localStorage.getItem('goalLevels')) || {};
    let dailyGoalTime = JSON.parse(localStorage.getItem('dailyGoalTime')) || {};
    let currentLevelUpGoal = null;

    const congratsMessage = document.getElementById('congratsMessage');
    const goalsListDiv = document.querySelector('.goals-list');
    const goalsContainer = document.getElementById('goalsContainer');
    const bigGoalTitle = document.getElementById('bigGoalTitle');
    const searchInput = document.getElementById('searchInput');
    const csvInput = document.getElementById('csvInput');
    const newGoalInput = document.getElementById('newGoalInput');
    const goalForm = document.getElementById('goalForm');
    const taskForm = document.getElementById('taskForm');
    const newTaskName = document.getElementById('newTaskName');
    const newTaskGoal = document.getElementById('newTaskGoal');
    const newTaskGoalsContainer = document.getElementById('newTaskGoalsContainer');

    /* ---------------------- UI helpers ---------------------- */
    function buildTagPill(name, selected = false) {
      const pill = document.createElement('span');
      pill.className = 'tag-pill' + (selected ? ' selected' : '');
      pill.textContent = name;
      pill.onclick = () => pill.classList.toggle('selected');
      return pill;
    }

    /* ---------------------- forms toggling ---------------------- */
    function toggleGoalForm() {
      goalForm.style.display = goalForm.style.display === 'block' ? 'none' : 'block';
      taskForm.style.display = 'none';
    }

    function toggleTaskForm() {
      taskForm.style.display = taskForm.style.display === 'block' ? 'none' : 'block';
      goalForm.style.display = 'none';
      // refresh tag pills each time the form opens
      newTaskGoalsContainer.innerHTML = '';
      const goalNames = Object.keys(goals);
      if (goalNames.length) {
        goalNames.forEach(name => newTaskGoalsContainer.appendChild(buildTagPill(name)));
      } else {
        newTaskGoalsContainer.textContent = 'No goals defined yet.';
      }
    }

    /* ---------------------- persistence helpers ---------------------- */
    function saveGoals() { localStorage.setItem('goals', JSON.stringify(goals)); }
    function saveGoalLevels() { localStorage.setItem('goalLevels', JSON.stringify(goalLevels)); }
    function saveDailyGoalTime() { localStorage.setItem('dailyGoalTime', JSON.stringify(dailyGoalTime)); }
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      localStorage.setItem('weeklyProgress', JSON.stringify(weeklyProgress));
    }

    /* ---------------------- goal calculation (FIXED) ---------------------- */
    function recalcGoalsFromTasks() {
      // 1️⃣ Preserve existing goals structure so orphan goals survive
      const updated = {};
      Object.keys(goals).forEach(name => {
        updated[name] = { ...goals[name], totalMinutes: 0 }; // reset totals, keep baselines
      });

      // 2️⃣ Accumulate totals from tasks
      tasks.forEach(t => {
        (t.tags || []).forEach(tag => {
          if (!updated[tag]) {
            updated[tag] = { totalMinutes: 0, weeklyBaseline: 0, weeklyMinutes: 0 };
          }
          updated[tag].totalMinutes += t.timeSpent;
        });
      });

      // 3️⃣ Recompute weekly minutes & defaults
      Object.keys(updated).forEach(name => {
        const g = updated[name];
        if (typeof g.weeklyBaseline !== 'number') g.weeklyBaseline = g.totalMinutes;
        g.weeklyMinutes = g.totalMinutes - g.weeklyBaseline;
      });

      goals = updated;
      saveGoals();
    }

    /* ---------------------- goal CRUD ---------------------- */
    function createGoal() {
      const name = newGoalInput.value.trim();
      if (!name) { alert('Goal name cannot be empty.'); return; }
      if (goals[name]) { alert('Goal already exists.'); return; }
      goals[name] = { totalMinutes: 0, weeklyMinutes: 0, weeklyBaseline: 0 };
      goalLevels[name] = { level: 1, showCelebration: false };
      saveGoals();
      saveGoalLevels();
      newGoalInput.value = '';
      toggleGoalForm();
      renderGoals();
    }

    function deleteGoal(name) {
      if (!confirm(`Delete goal "${name}"?`)) return;
      delete goals[name];
      delete goalLevels[name];
      delete dailyGoalTime[name];
      localStorage.removeItem(`lastCelebratedMilestone_${name}`);
      tasks.forEach(t => { if (t.tags) t.tags = t.tags.filter(tag => tag !== name); });
      saveGoals();
      saveGoalLevels();
      saveDailyGoalTime();
      saveTasks();
      recalcGoalsFromTasks();
      renderGoals();
      renderTasks();
    }

    /* ---------------------- task CRUD ---------------------- */
    function addTask() {
      const name = newTaskName.value.trim();
      if (!name) { alert('Task name cannot be empty.'); return; }
      const goalNum = parseInt(newTaskGoal.value) || 0;
      const selectedGoals = Array.from(newTaskGoalsContainer.querySelectorAll('.tag-pill.selected')).map(p => p.textContent);

      tasks.unshift({
        name,
        goal: goalNum,
        progress: 0,
        timeSpent: 0,
        tags: selectedGoals,
        lastUpdated: new Date().toISOString()
      });

      newTaskName.value = '';
      newTaskGoal.value = '';
      toggleTaskForm();
      saveTasks();
      recalcGoalsFromTasks();
      renderTasks();
    }

    function toggleEditForm(i) {
      const f = document.getElementById(`editForm${i}`);
      if (f) f.style.display = f.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveEdit(i) {
      const n = document.getElementById(`editName${i}`).value.trim();
      const gVal = parseInt(document.getElementById(`editGoal${i}`).value) || 0;
      const pVal = parseInt(document.getElementById(`editProgress${i}`).value) || 0;
      const tVal = parseInt(document.getElementById(`editTime${i}`).value) || 0;
      const sel = Array.from(document.getElementById(`editTaskGoals${i}`).querySelectorAll('.tag-pill.selected')).map(p => p.textContent);
      if (!n) { alert('Name cannot be empty'); return; }

      const t = tasks.splice(i, 1)[0];
      const timeDiff = tVal - t.timeSpent;

      // Update daily goal time tracking for time changes
      if (timeDiff !== 0) {
        sel.forEach(goalName => {
          updateDailyGoalTime(goalName, timeDiff);
        });
      }

      Object.assign(t, { name: n, goal: gVal, progress: pVal, timeSpent: tVal, tags: sel });
      tasks.unshift(t);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }

    function deleteTask(i) {
      if (!confirm(`Delete task "${tasks[i].name}"?`)) return;
      tasks.splice(i, 1);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }

    function incrementProgress(i) {
      const t = tasks.splice(i, 1)[0];
      t.progress++;
      tasks.unshift(t);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }

    function incrementTime(i, mins) {
      const t = tasks.splice(i, 1)[0];
      t.timeSpent += mins;

      // Update daily goal time tracking
      (t.tags || []).forEach(goalName => {
        updateDailyGoalTime(goalName, mins);
      });

      tasks.unshift(t);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }

    /* ---------------------- weekly tracking ---------------------- */
    function shouldResetWeeklyProgress(now, last) {
      if (!last) return true;
      const lastDay = new Date(last).getDay();
      const today = now.getDay();
      return (today === 1 && lastDay !== 1) || (now - new Date(last) > 7 * 24 * 60 * 60 * 1000);
    }

    function resetWeeklyProgress(now) {
      const monday = new Date(now);
      monday.setDate(now.getDate() - now.getDay() + 1);
      monday.setHours(0, 0, 0, 0);
      weeklyProgress = { startDate: monday.toISOString() };
      localStorage.setItem('weeklyProgress', JSON.stringify(weeklyProgress));
      Object.keys(goals).forEach(name => goals[name].weeklyBaseline = goals[name].totalMinutes);
      saveGoals();
    }

    function updateWeeklyProgress() {
      const now = new Date();
      if (shouldResetWeeklyProgress(now, weeklyProgress.startDate)) resetWeeklyProgress(now);
    }

    /* ---------------------- daily time tracking ---------------------- */
    function getTodayKey() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    function getWeekDates() {
      const now = new Date();
      const monday = new Date(now);
      monday.setDate(now.getDate() - now.getDay() + 1);

      const weekDates = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + i);
        weekDates.push(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`);
      }
      return weekDates;
    }

    function updateDailyGoalTime(goalName, minutesAdded) {
      const today = getTodayKey();
      if (!dailyGoalTime[goalName]) {
        dailyGoalTime[goalName] = {};
      }
      if (!dailyGoalTime[goalName][today]) {
        dailyGoalTime[goalName][today] = 0;
      }
      dailyGoalTime[goalName][today] += minutesAdded;
      saveDailyGoalTime();
    }

    function buildWeeklyDashboard(goalName) {
      const weekDates = getWeekDates();
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const goalData = dailyGoalTime[goalName] || {};

      // Fixed scale: 3 hours (180 minutes) = full bar height
      const maxMinutes = 180; // 3 hours

      let chartHTML = '<div class="weekly-dashboard"><div class="weekly-chart">';

      weekDates.forEach((date, index) => {
        const minutes = goalData[date] || 0;
        const hours = Math.floor(minutes / 60);
        const remainingMins = minutes % 60;

        // Scale based on fixed 3-hour maximum (180 minutes) - shorter bars
        const height = minutes > 0 ? Math.max((minutes / maxMinutes) * 20, 2) : 2;

        const timeText = hours > 0 ?
          (remainingMins > 0 ? `${hours}h ${remainingMins}m` : `${hours}h`) :
          (remainingMins > 0 ? `${remainingMins}m` : '0m');

        chartHTML += `
          <div class="day-bar">
            <div class="bar" style="height: ${height}px;">
              <div class="time-tooltip">${timeText}</div>
            </div>
            <div class="day-label">${dayLabels[index]}</div>
          </div>`;
      });

      chartHTML += '</div></div>';
      return chartHTML;
    }

    /* ---------------------- rendering ---------------------- */
    function renderGoals() {
      goalsContainer.innerHTML = '';
      const names = Object.keys(goals);
      if (!names.length) { goalsListDiv.style.display = 'none'; return; }
      goalsListDiv.style.display = 'block';

      const buildCard = (gName, fullWidth = false) => {
        const d = goals[gName];
        const level = goalLevels[gName] || { level: 1, showCelebration: false };
        const targetHours = level.level * 1000;
        const overall = Math.min((d.totalMinutes / (targetHours * 60)) * 100, 100);
        const weekly = Math.min((d.weeklyMinutes / (GOAL_WEEKLY_HOURS * 60)) * 100, 100);
        const th = Math.floor(d.totalMinutes / 60);
        const wh = Math.floor(d.weeklyMinutes / 60);

        // Check if should show celebration
        if (checkForLevelUp(gName)) {
          setTimeout(() => showLevelUpModal(gName), 100);
        }

        const card = document.createElement('div');
        card.className = 'goal-card' + (fullWidth ? ' full-width-goal' : '');
        card.style.position = 'relative';

        const celebrationBadge = level.showCelebration ?
          `<button class="celebration-badge" onclick="showLevelUpModal('${gName}')">🎉</button>` : '';

        card.innerHTML = `
          <h3>${gName}${level.level > 1 ? `<span class="level-indicator">lv.${level.level}</span>` : ''}</h3>
          <div class="goal-progress-bar">
            <div class="goal-progress" style="width:${overall}%"></div>
            <div class="goal-progress-text">${th}/${targetHours}</div>
          </div>
          <div class="goal-progress-bar">
            <div class="goal-progress" style="width:${weekly}%"></div>
            <div class="goal-progress-text">${wh}/${GOAL_WEEKLY_HOURS}</div>
          </div>
          ${buildWeeklyDashboard(gName)}
          <div class="edit-delete-btns">
            ${celebrationBadge}
            <button onclick="startEditGoal('${gName}')">✏️</button>
            <button onclick="deleteGoal('${gName}')">🗑️</button>
          </div>`;
        return card;
      };

      if (names.length === 1) {
        goalsContainer.appendChild(buildCard(names[0], true));
      } else {
        names.forEach(name => goalsContainer.appendChild(buildCard(name)));
      }
    }

    function renderTasks() {
      const query = searchInput.value.toLowerCase();
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      tasks.forEach((task, i) => {
        if (!task.name.toLowerCase().includes(query)) return;
        const perc = task.goal > 0 ? (task.progress / task.goal) * 100 : 0;
        const tagPills = Object.keys(goals).map(name => {
          const sel = task.tags.includes(name);
          return `<span class="tag-pill ${sel ? 'selected' : ''}" onclick="this.classList.toggle('selected')">${name}</span>`;
        }).join('');

        const el = document.createElement('div');
        el.className = 'task';
        el.innerHTML = `
          <div class="task-header">
            <span class="task-title">${task.name}</span>
            <div class="increment-buttons">
              <button class="small-button" onclick="toggleEditForm(${i})">Edit</button>
              <button class="small-button" onclick="deleteTask(${i})">Delete</button>
            </div>
          </div>
          <p>${task.timeSpent} minutes</p>
          <div class="progress-bar">
            <div class="progress" style="width:${perc}%"></div>
            <div class="progress-text">${task.progress}/${task.goal}</div>
          </div>
          <p>Tags: ${task.tags.join(', ')}</p>
          <div class="increment-buttons">
            <button class="small-button" onclick="incrementTime(${i},1)">+1 Min</button>
            <button class="small-button" onclick="incrementTime(${i},5)">+5 Min</button>
            <button class="small-button" onclick="incrementTime(${i},10)">+10 Min</button>
            <button class="small-button" onclick="incrementProgress(${i})">+1 Prog</button>
          </div>
          <div class="edit-form" id="editForm${i}" style="display:none;">
            <label>Task Name</label>
            <input type="text" id="editName${i}" value="${task.name}">
            <label>Goal</label>
            <input type="number" id="editGoal${i}" value="${task.goal}">
            <label>Progress</label>
            <input type="number" id="editProgress${i}" value="${task.progress}">
            <label>Time Spent (min)</label>
            <input type="number" id="editTime${i}" value="${task.timeSpent}">
            <p>Select Goals (Tags):</p>
            <div id="editTaskGoals${i}">
              ${tagPills}
            </div>
            <button class="small-button" onclick="saveEdit(${i})">Save</button>
          </div>`;
        list.appendChild(el);
      });

      // milestone celebrations
      Object.entries(goals).forEach(([name, data]) => {
        const hours = Math.floor(data.totalMinutes / 60);
        const milestone = Math.floor(hours / 10) * 10;
        const key = `lastCelebratedMilestone_${name}`;
        const last = parseInt(localStorage.getItem(key)) || 0;
        if (milestone > 0 && milestone > last) {
          showCongratulation(`Goal “${name}” hit ${milestone} h!`);
          localStorage.setItem(key, milestone);
        }
      });

      updateWeeklyProgress();
      renderGoals();
      bigGoalTitle.textContent = BIG_GOAL_NAME;
    }

    /* ---------------------- level up functionality ---------------------- */
    function checkForLevelUp(goalName) {
      const goal = goals[goalName];
      if (!goal) return;

      const hours = Math.floor(goal.totalMinutes / 60);
      const level = goalLevels[goalName] || { level: 1, showCelebration: false };
      const targetHours = level.level * 1000;

      if (hours >= targetHours && !level.showCelebration) {
        level.showCelebration = true;
        goalLevels[goalName] = level;
        saveGoalLevels();
        return true;
      }
      return false;
    }

    function showLevelUpModal(goalName) {
      currentLevelUpGoal = goalName;
      const level = goalLevels[goalName];
      const targetHours = level.level * 1000;

      document.getElementById('levelUpTitle').textContent = `🎉 Congratulations!`;
      document.getElementById('levelUpMessage').textContent = `"${goalName}" has reached ${targetHours} hours!`;
      document.getElementById('levelUpModal').style.display = 'flex';

      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function keepCelebration() {
      document.getElementById('levelUpModal').style.display = 'none';
      currentLevelUpGoal = null;
      renderGoals();
    }

    function levelUpGoal() {
      if (!currentLevelUpGoal) return;

      const goalName = currentLevelUpGoal;
      const level = goalLevels[goalName];
      level.level += 1;
      level.showCelebration = false;
      goalLevels[goalName] = level;
      saveGoalLevels();

      document.getElementById('levelUpModal').style.display = 'none';
      renderGoals();

      showCongratulation(`"${goalName}" leveled up! New target: ${level.level * 1000} hours`);
      currentLevelUpGoal = null;
    }

    /* ---------------------- misc helpers ---------------------- */
    function showCongratulation(msg) {
      congratsMessage.textContent = msg;
      congratsMessage.style.display = 'block';
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      setTimeout(() => congratsMessage.style.display = 'none', 5000);
    }

    /* ---------------------- goal edit placeholder ---------------------- */
    function startEditGoal(name) {
      const newName = prompt('Rename goal?', name);
      if (!newName || newName === name) return;
      if (goals[newName]) { alert('Name already exists'); return; }
      goals[newName] = goals[name];
      goalLevels[newName] = goalLevels[name] || { level: 1, showCelebration: false };
      dailyGoalTime[newName] = dailyGoalTime[name] || {};
      delete goals[name];
      delete goalLevels[name];
      delete dailyGoalTime[name];
      tasks.forEach(t => {
        if (t.tags) t.tags = t.tags.map(tag => tag === name ? newName : tag);
      });
      saveGoals(); saveGoalLevels(); saveDailyGoalTime(); saveTasks(); renderGoals(); renderTasks();
    }

    /* ---------------------- XLSX import/export ---------------------- */
    async function importXLSX(evt) {
      try {
        const file = evt.target.files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, { type: 'array' });
        if (!wb.SheetNames.includes('Tasks')) { alert("No 'Tasks' sheet"); return; }
        const js = XLSX.utils.sheet_to_json(wb.Sheets['Tasks']);
        if (!js.length) { alert('No tasks'); return; }
        tasks = js.map(r => ({
          name: r.Name || '',
          goal: parseInt(r.Goal) || 0,
          progress: parseInt(r.Progress) || 0,
          timeSpent: parseInt(r.TimeSpent) || 0,
          tags: r.Tags ? r.Tags.split(',').map(t => t.trim()) : [],
          lastUpdated: new Date().toISOString()
        }));
        saveTasks(); recalcGoalsFromTasks(); renderTasks(); renderGoals();
        alert(`Imported ${tasks.length} tasks!`);
      } catch (e) {
        console.error(e); alert('Import failed');
      } finally {
        csvInput.value = '';
      }
    }

    function exportXLSX() {
      const data = tasks.map(t => ({
        Name: t.name,
        Goal: t.goal,
        Progress: t.progress,
        TimeSpent: t.timeSpent,
        Tags: t.tags.join(', ')
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
      XLSX.writeFile(wb, 'data.xlsx');
      alert('Export complete!');
    }

    /* ---------------------- clear ---------------------- */
    function clearStorage() {
      if (!confirm('This will delete all data – continue?')) return;
      localStorage.clear();
      tasks = []; weeklyProgress = { startDate: null }; goals = {};
      BIG_GOAL_NAME = '1000 Hours';
      GOAL_TOTAL_HOURS = 1000;
      GOAL_WEEKLY_HOURS = 21;
      renderTasks(); renderGoals();
    }

    /* ---------------------- init ---------------------- */
    function loadData() {
      tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      weeklyProgress = JSON.parse(localStorage.getItem('weeklyProgress')) || { startDate: null };
      goals = JSON.parse(localStorage.getItem('goals')) || {};
      goalLevels = JSON.parse(localStorage.getItem('goalLevels')) || {};
      dailyGoalTime = JSON.parse(localStorage.getItem('dailyGoalTime')) || {};

      // Initialize goal levels for existing goals
      Object.keys(goals).forEach(goalName => {
        if (!goalLevels[goalName]) {
          goalLevels[goalName] = { level: 1, showCelebration: false };
        }
      });
      saveGoalLevels();

      recalcGoalsFromTasks();
      const now = new Date();
      if (shouldResetWeeklyProgress(now, weeklyProgress.startDate)) resetWeeklyProgress(now);
      renderTasks();
      renderGoals();
      searchInput.addEventListener('input', renderTasks);
    }

    csvInput.addEventListener('change', importXLSX);
    window.addEventListener('load', loadData);
  </script>
</body>

</html>
