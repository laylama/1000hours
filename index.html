<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌲 1000 Hours</title>
  <link rel="apple-touch-icon" href="logo2.png">
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="1000 Hours"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap');
    :root {
      --salmon: #F79F77;
      --light-blue: #80BEF5;
      --pale-yellow: #F6D58A;
      --black: #010101;
      --white: #FFFFFF;
      --light-gray: #F5F5F5;
    }
    body {
      font-family: 'Raleway', sans-serif;
      color: var(--black);
      line-height: 1.6;
      padding: 20px;
      background-color: var(--white);
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
    }
    .goal-card.full-width-goal { width: 90%; max-width: 90%; }
    h1 {
      font-size: 40px;
      color: var(--black);
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .corner-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }
    .corner-button {
      padding: 5px 10px;
      font-size: 12px;
      background-color: transparent;
      color: var(--black);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .corner-button:hover { background-color: rgba(128,190,245,0.2); }
    .goal-form, .task-form {
      display: none;
      background: var(--light-gray);
      padding: 10px;
      border-radius: 10px;
      position: absolute;
      top: 40px;
      right: 10px;
      z-index: 999;
    }
    .goal-form input, .task-form input {
      width: calc(100% - 2rem);
      padding: 12px 15px;
      border: 2px solid var(--light-blue);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .goal-form button, .task-form button {
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .goal-form button:hover, .task-form button:hover { background: var(--salmon); }
    .search-bar {
      width: calc(100% - 2rem);
      padding: 12px 15px;
      border: 2px solid var(--light-blue);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }
    button, .small-button {
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover, .small-button:hover {
      background: var(--salmon);
      transform: translateY(-2px);
    }
    button:active, .small-button:active { transform: translateY(1px); }
    #csvInput { display: none; }
    .task {
      background: var(--light-gray);
      border: none;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .task-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--black);
    }
    .progress-bar {
      position: relative;
      height: 16px;
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      margin: 15px 0;
    }
    .progress {
      height: 100%;
      background: linear-gradient(
        45deg,
        var(--salmon),
        var(--light-blue),
        var(--pale-yellow)
      );
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: var(--black);
      font-weight: 600;
    }
    .increment-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .increment-buttons button {
      padding: 8px 12px;
      font-size: 12px;
      flex: 1;
      min-width: 70px;
    }
    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .tag-pill {
      display: inline-block;
      background: var(--light-blue);
      color: var(--white);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    .tag-pill.selected { background: var(--salmon); }
    #congratsMessage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #4CAF50;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 1000;
      display: none;
    }
    .goals-list { margin-bottom: 8px; }
    .goals-list h2 {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .goals-scroll {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 10px;
    }
    .goal-card {
      background: var(--light-gray);
      border-radius: 10px;
      padding: 15px;
      min-width: 200px;
      flex: 0 0 auto;
      position: relative;
    }
    .goal-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--black);
    }
    .goal-progress-bar {
      position: relative;
      height: 16px;
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .goal-progress {
      height: 100%;
      background: linear-gradient(
        45deg,
        var(--salmon),
        var(--light-blue),
        var(--pale-yellow)
      );
      transition: width 0.3s ease;
    }
    .goal-progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: var(--black);
      font-weight: 600;
    }
    .edit-delete-btns {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }
    .edit-delete-btns button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: var(--black);
      padding: 3px 5px;
      border-radius: 5px;
    }
    .edit-delete-btns button:hover {
      background: var(--light-blue);
      color: var(--white);
    }
  </style>
</head>
<body>
  <div id="congratsMessage"></div>

  <div class="container">
    <div class="corner-buttons">
      <button class="corner-button" onclick="toggleGoalForm()">+ Goal</button>
      <button class="corner-button" onclick="toggleTaskForm()">+ Task</button>
    </div>

    <div class="goal-form" id="goalForm">
      <input type="text" id="newGoalInput" placeholder="Enter new goal name" />
      <button onclick="createGoal()">Add</button>
    </div>

    <div class="task-form" id="taskForm">
      <input type="text" id="newTaskName" placeholder="Enter new task name" />
      <input type="number" id="newTaskGoal" placeholder="Task goal (number)" />
      <p>Select Goals (Tags):</p>
      <div id="newTaskGoalsContainer"></div>
      <button onclick="addTask()">Add</button>
    </div>

    <h1 id="bigGoalTitle"></h1>

    <div class="goals-list" style="display:none;">
      <h2>Goals</h2>
      <div class="goals-scroll" id="goalsContainer"></div>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Search tasks..." />
    <div id="taskList"></div>

    <div class="button-group">
      <label for="csvInput" id="csvLabel" class="small-button">Import</label>
      <input type="file" id="csvInput" accept=".xlsx" />
      <button onclick="exportXLSX()" class="small-button">Export</button>
      <button onclick="clearStorage()" class="small-button">Clear</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    let BIG_GOAL_NAME = "1000 Hours";
    let GOAL_TOTAL_HOURS = 1000;
    let GOAL_WEEKLY_HOURS = 21;
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let weeklyProgress = JSON.parse(localStorage.getItem('weeklyProgress')) || { startDate: null };
    let goals = JSON.parse(localStorage.getItem('goals')) || {};

    const congratsMessage = document.getElementById('congratsMessage');
    const goalsListDiv = document.querySelector('.goals-list');
    const goalsContainer = document.getElementById('goalsContainer');
    const bigGoalTitle = document.getElementById('bigGoalTitle');
    const searchInput = document.getElementById('searchInput');
    const csvInput = document.getElementById('csvInput');
    const newGoalInput = document.getElementById('newGoalInput');
    const goalForm = document.getElementById('goalForm');
    const taskForm = document.getElementById('taskForm');
    const newTaskName = document.getElementById('newTaskName');
    const newTaskGoal = document.getElementById('newTaskGoal');
    const newTaskGoalsContainer = document.getElementById('newTaskGoalsContainer');

    function toggleGoalForm() {
      goalForm.style.display =
        goalForm.style.display === 'none' || goalForm.style.display === ''
          ? 'block'
          : 'none';
      taskForm.style.display = 'none';
    }

    function toggleTaskForm() {
      taskForm.style.display =
        taskForm.style.display === 'none' || taskForm.style.display === ''
          ? 'block'
          : 'none';
      goalForm.style.display = 'none';
      newTaskGoalsContainer.innerHTML = '';
      const goalNames = Object.keys(goals);
      if (goalNames.length) {
        goalNames.forEach(gName => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill';
          pill.textContent = gName;
          pill.onclick = () => pill.classList.toggle('selected');
          newTaskGoalsContainer.appendChild(pill);
        });
      } else {
        const noGoalsMsg = document.createElement('p');
        noGoalsMsg.textContent = 'No goals defined yet.';
        newTaskGoalsContainer.appendChild(noGoalsMsg);
      }
    }

    function saveGoals() {
      localStorage.setItem('goals', JSON.stringify(goals));
    }
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      localStorage.setItem('weeklyProgress', JSON.stringify(weeklyProgress));
    }

    function recalcGoalsFromTasks() {
      const oldGoals = goals;
      goals = {};
      tasks.forEach(task => {
        if (task.tags && task.tags.length) {
          task.tags.forEach(tag => {
            if (!goals[tag]) goals[tag] = { totalMinutes:0, weeklyMinutes:0, weeklyBaseline:0 };
            goals[tag].totalMinutes += task.timeSpent;
          });
        }
      });
      for (const gName in goals) {
        if (oldGoals[gName] && typeof oldGoals[gName].weeklyBaseline === 'number') {
          goals[gName].weeklyBaseline = oldGoals[gName].weeklyBaseline;
        } else {
          goals[gName].weeklyBaseline = goals[gName].totalMinutes;
        }
        goals[gName].weeklyMinutes = goals[gName].totalMinutes - goals[gName].weeklyBaseline;
      }
      saveGoals();
    }

    function createGoal() {
      const name = newGoalInput.value.trim();
      if (!name) { alert('Goal name cannot be empty.'); return; }
      if (goals[name]) { alert('Goal already exists.'); return; }
      goals[name] = { totalMinutes:0, weeklyMinutes:0, weeklyBaseline:0 };
      goals[name].weeklyBaseline = 0;
      saveGoals();
      newGoalInput.value = '';
      toggleGoalForm();
      renderGoals();
    }

    function deleteGoal(gName) {
      if (!confirm(`Delete goal "${gName}"?`)) return;
      delete goals[gName];
      localStorage.removeItem(`lastCelebratedMilestone_${gName}`);
      tasks.forEach(task => {
        if (task.tags) task.tags = task.tags.filter(t => t !== gName);
      });
      saveGoals();
      saveTasks();
      recalcGoalsFromTasks();
      renderGoals();
      renderTasks();
    }

    function addTask() {
      const name = newTaskName.value.trim();
      if (!name) { alert('Task name cannot be empty.'); return; }
      const goalNum = parseInt(newTaskGoal.value) || 0;
      const selectedGoals = Array.from(
        newTaskGoalsContainer.querySelectorAll('.tag-pill.selected')
      ).map(p => p.textContent);

      tasks.unshift({
        name,
        timeSpent: 0,
        goal: goalNum,
        progress: 0,
        tags: selectedGoals,
        lastUpdated: new Date().toISOString()
      });

      newTaskName.value = '';
      newTaskGoal.value = '';
      toggleTaskForm();
      saveTasks();
      recalcGoalsFromTasks();
      renderTasks();
    }

    function showCongratulation(msg) {
      congratsMessage.textContent = msg;
      congratsMessage.style.display = 'block';
      confetti({ particleCount:100, spread:70, origin:{ y:0.6 } });
      setTimeout(()=> congratsMessage.style.display='none', 5000);
    }

    function shouldResetWeeklyProgress(now, last) {
      if (!last) return true;
      const lastDay = new Date(last).getDay();
      const today = now.getDay();
      return (today===1 && lastDay!==1)
        || (now - new Date(last) > 7*24*60*60*1000);
    }
    function resetWeeklyProgress(now) {
      const monday = new Date(now);
      monday.setDate(now.getDate() - now.getDay() + 1);
      monday.setHours(0,0,0,0);
      weeklyProgress = { startDate: monday.toISOString() };
      localStorage.setItem('weeklyProgress', JSON.stringify(weeklyProgress));
      for (const gName in goals) {
        goals[gName].weeklyBaseline = goals[gName].totalMinutes;
      }
      saveGoals();
    }
    function updateWeeklyProgress() {
      const now = new Date();
      if (shouldResetWeeklyProgress(now, weeklyProgress.startDate)) {
        resetWeeklyProgress(now);
      }
    }

    function renderGoals() {
      goalsContainer.innerHTML = '';
      const names = Object.keys(goals);
      if (names.length) {
        goalsListDiv.style.display = 'block';
        if (names.length === 1) {
          // single-goal full width
          const gName = names[0], d = goals[gName];
          const overall = Math.min((d.totalMinutes/(GOAL_TOTAL_HOURS*60))*100,100);
          const weekly = Math.min((d.weeklyMinutes/(GOAL_WEEKLY_HOURS*60))*100,100);
          const th = Math.floor(d.totalMinutes/60), wh = Math.floor(d.weeklyMinutes/60);
          const card = document.createElement('div');
          card.className = 'goal-card full-width-goal';
          card.innerHTML = `
            <h3>${gName}</h3>
            <div class="goal-progress-bar">
              <div class="goal-progress" style="width:${overall}%"></div>
              <div class="goal-progress-text">${th}/${GOAL_TOTAL_HOURS}</div>
            </div>
            <div class="goal-progress-bar">
              <div class="goal-progress" style="width:${weekly}%"></div>
              <div class="goal-progress-text">${wh}/${GOAL_WEEKLY_HOURS}</div>
            </div>
            <div class="edit-delete-btns">
              <button onclick="startEditGoal('${gName}')">✏️</button>
              <button onclick="deleteGoal('${gName}')">🗑️</button>
            </div>`;
          goalsContainer.appendChild(card);
        } else {
          names.forEach(gName => {
            const d = goals[gName];
            const overall = Math.min((d.totalMinutes/(GOAL_TOTAL_HOURS*60))*100,100);
            const weekly = Math.min((d.weeklyMinutes/(GOAL_WEEKLY_HOURS*60))*100,100);
            const th = Math.floor(d.totalMinutes/60), wh = Math.floor(d.weeklyMinutes/60);
            const card = document.createElement('div');
            card.className = 'goal-card';
            card.innerHTML = `
              <h3>${gName}</h3>
              <div class="goal-progress-bar">
                <div class="goal-progress" style="width:${overall}%"></div>
                <div class="goal-progress-text">${th}/${GOAL_TOTAL_HOURS}</div>
              </div>
              <div class="goal-progress-bar">
                <div class="goal-progress" style="width:${weekly}%"></div>
                <div class="goal-progress-text">${wh}/${GOAL_WEEKLY_HOURS}</div>
              </div>
              <div class="edit-delete-btns">
                <button onclick="startEditGoal('${gName}')">✏️</button>
                <button onclick="deleteGoal('${gName}')">🗑️</button>
              </div>`;
            goalsContainer.appendChild(card);
          });
        }
      } else {
        goalsListDiv.style.display = 'none';
      }
    }

    function renderTasks() {
      const query = searchInput.value.toLowerCase();
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      const totalMinutes = tasks.reduce((s,t)=>s+t.timeSpent,0);

      tasks.forEach((task,i) => {
        if (!task.name.toLowerCase().includes(query)) return;
        const perc = task.goal>0? (task.progress/task.goal)*100:0;
        const tags = (task.tags&&task.tags.length)? `Tags: ${task.tags.join(', ')}`:'';
        const tagPills = Object.keys(goals).map(gName => {
          const sel = task.tags.includes(gName)? 'selected':''; 
          return `<span class="tag-pill ${sel}" onclick="this.classList.toggle('selected')">${gName}</span>`;
        }).join('');
        const el = document.createElement('div');
        el.className = 'task';
        el.innerHTML = `
          <div class="task-header">
            <span class="task-title">${task.name}</span>
            <div class="increment-buttons">
              <button class="small-button" onclick="toggleEditForm(${i})">Edit</button>
              <button class="small-button" onclick="deleteTask(${i})">Delete</button>
            </div>
          </div>
          <p>${task.timeSpent} minutes</p>
          <div class="progress-bar">
            <div class="progress" style="width:${perc}%"></div>
            <div class="progress-text">${task.progress}/${task.goal}</div>
          </div>
          <p>${tags}</p>
          <div class="increment-buttons">
            <button class="small-button" onclick="incrementTime(${i},1)">+1 Min</button>
            <button class="small-button" onclick="incrementTime(${i},5)">+5 Min</button>
            <button class="small-button" onclick="incrementTime(${i},10)">+10 Min</button>
            <button class="small-button" onclick="incrementProgress(${i})">+1 Prog</button>
          </div>
          <div class="edit-form" id="editForm${i}" style="display:none;">
            <label>Task Name</label>
            <input type="text" id="editName${i}" value="${task.name}">
            <label>Goal</label>
            <input type="number" id="editGoal${i}" value="${task.goal}">
            <label>Progress</label>
            <input type="number" id="editProgress${i}" value="${task.progress}">
            <label>Time Spent (min)</label>
            <input type="number" id="editTime${i}" value="${task.timeSpent}">
            <p>Select Goals (Tags):</p>
            <div id="editTaskGoals${i}" class="editTaskGoalsContainer">
              ${tagPills}
            </div>
            <button class="small-button" onclick="saveEdit(${i})">Save</button>
          </div>`;
        list.appendChild(el);
      });

      // 🎉 per-goal 10h celebrations:
      Object.entries(goals).forEach(([gName, gData]) => {
        const hours = Math.floor(gData.totalMinutes / 60);
        const milestone = Math.floor(hours / 10) * 10;
        const key = `lastCelebratedMilestone_${gName}`;
        const last = parseInt(localStorage.getItem(key)) || 0;
        if (milestone > 0 && milestone > last) {
          showCongratulation(`Goal “${gName}” hit ${milestone} h!`);
          localStorage.setItem(key, milestone);
        }
      });

      updateWeeklyProgress();
      renderGoals();
      bigGoalTitle.textContent = BIG_GOAL_NAME;
    }

    function toggleEditForm(i) {
      const f = document.getElementById(`editForm${i}`);
      if (f) f.style.display = f.style.display==='none'?'flex':'none';
    }
    function saveEdit(i) {
      const n = document.getElementById(`editName${i}`).value.trim();
      const gVal = parseInt(document.getElementById(`editGoal${i}`).value)||0;
      const pVal = parseInt(document.getElementById(`editProgress${i}`).value)||0;
      const tVal = parseInt(document.getElementById(`editTime${i}`).value)||0;
      const sel = Array.from(
        document.getElementById(`editTaskGoals${i}`).querySelectorAll('.tag-pill.selected')
      ).map(p=>p.textContent);
      if (!n) { alert('Name cannot be empty'); return; }
      const t = tasks.splice(i,1)[0];
      t.name=n; t.goal=gVal; t.progress=pVal; t.timeSpent=tVal; t.tags=sel;
      tasks.unshift(t);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }
    function deleteTask(i) {
      if (!confirm(`Delete task "${tasks[i].name}"?`)) return;
      tasks.splice(i,1);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }
    function incrementProgress(i) {
      const t = tasks.splice(i,1)[0];
      t.progress++;
      tasks.unshift(t);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }
    function incrementTime(i, mins) {
      const t = tasks.splice(i,1)[0];
      t.timeSpent += mins;
      tasks.unshift(t);
      saveTasks(); recalcGoalsFromTasks(); renderTasks();
    }

    async function importXLSX(evt) {
      try {
        const file = evt.target.files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data,{type:'array'});
        if (!wb.SheetNames.includes('Tasks')) {
          alert("No 'Tasks' sheet"); return;
        }
        const js = XLSX.utils.sheet_to_json(wb.Sheets['Tasks']);
        if (!js.length) { alert("No tasks"); return; }
        tasks = js.map(r=>{
          return {
            name: r.Name||'',
            goal: parseInt(r.Goal)||0,
            progress: parseInt(r.Progress)||0,
            timeSpent: parseInt(r.TimeSpent)||0,
            tags: r.Tags? r.Tags.split(',').map(t=>t.trim()):[],
            lastUpdated: new Date().toISOString()
          };
        });
        saveTasks(); recalcGoalsFromTasks(); renderTasks(); renderGoals();
        alert(`Imported ${tasks.length} tasks!`);
      } catch(e) {
        console.error(e); alert('Import failed');
      } finally {
        csvInput.value = '';
      }
    }

    function exportXLSX() {
      const data = tasks.map(t=>({
        Name:t.name, Goal:t.goal, Progress:t.progress,
        TimeSpent:t.timeSpent, Tags:t.tags.join(', ')
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
      XLSX.writeFile(wb, 'data.xlsx');
      alert('Export complete!');
    }

    function clearStorage() {
      localStorage.removeItem('tasks');
      localStorage.removeItem('weeklyProgress');
      localStorage.removeItem('goals');
      // remove all per-goal milestone keys
      Object.keys(localStorage).forEach(k=>{
        if (k.startsWith('lastCelebratedMilestone_')) localStorage.removeItem(k);
      });
      tasks=[]; weeklyProgress={startDate:null}; goals={};
      BIG_GOAL_NAME='1000 Hours';
      GOAL_TOTAL_HOURS=1000; GOAL_WEEKLY_HOURS=21;
      renderTasks(); renderGoals();
    }

    function loadData() {
      const t = localStorage.getItem('tasks');
      if (t) tasks=JSON.parse(t);
      const w = localStorage.getItem('weeklyProgress');
      weeklyProgress = w? JSON.parse(w) : { startDate:null };
      const g = localStorage.getItem('goals');
      if (g) goals=JSON.parse(g);

      recalcGoalsFromTasks();
      const now = new Date();
      if (shouldResetWeeklyProgress(now, weeklyProgress.startDate)) {
        resetWeeklyProgress(now);
      }
      renderTasks();
      renderGoals();
      searchInput.addEventListener('input', renderTasks);
    }

    csvInput.addEventListener('change', importXLSX);
    window.addEventListener('load', loadData);
  </script>
</body>
</html>
